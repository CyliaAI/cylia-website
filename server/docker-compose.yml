version: "3.9"

services:
  api:
    build: .
    container_name: tf_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

  worker:
    build: .
    container_name: tf_worker
    command: node dist/workers/flowWorker.js
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
